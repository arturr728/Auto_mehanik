plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.narezany.avtomaster'
    compileSdk 34

    defaultConfig {
        applicationId "ru.narezany.avtomaster"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "0.3.2-alpha"
    }

    // Постоянный ключ подписи: без него каждая сборка получает новую подпись,
    // и Android отказывается ставить обновление поверх установленной игры.
    signingConfigs {
        release {
            storeFile file("avtomaster.jks")
            storePassword "avtomaster2026"
            keyAlias "avtomaster"
            keyPassword "avtomaster2026"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
