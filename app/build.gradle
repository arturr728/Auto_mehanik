plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.narezany.avtomaster'
    compileSdk 34

    defaultConfig {
        applicationId "ru.narezany.avtomaster"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "0.3-alpha"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            // чтобы release-сборка тоже ставилась без отдельного ключа
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
