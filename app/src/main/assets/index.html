<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1014">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Автомастерская</title>
<style>
:root{
  --bg:#0d1014;
  --panel:#161c24;
  --panel2:#1e2733;
  --line:#25303e;
  --acc:#ff8a1f;
  --ok:#3ddc84;
  --bad:#ff4d5e;
  --txt:#e8eef6;
  --dim:#8b97a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#1b2430 0%,#0d1014 62%);
  color:var(--txt);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#app{
  position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:8px 12px 0;
  padding:calc(8px + env(safe-area-inset-top)) 12px 0;
}
.hidden{display:none !important}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:7px;flex:none;padding-bottom:8px}
.chip{
  display:flex;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:6px 9px;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
  transition:transform .15s;
}
.chip.bump{transform:scale(1.12)}
.chip .ico{font-size:13px;line-height:1}
#hearts{margin-left:auto;letter-spacing:.5px;font-size:13px;padding:6px 7px}
#hearts .off{opacity:.22}
#soundBtn{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  color:var(--txt);font-size:14px;padding:6px 8px;line-height:1;
}

/* ---------- tabs ---------- */
.tabwrap{position:relative;flex:1;min-height:0}
.tab{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:14px;
}
nav.tabs{
  flex:none;display:flex;gap:6px;
  padding:8px 0;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:transparent;border:1px solid transparent;border-radius:14px;
  color:var(--dim);font-family:inherit;font-size:10.5px;font-weight:700;
  padding:7px 4px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
nav.tabs button .e{font-size:19px;line-height:1;filter:grayscale(.6);transition:filter .15s}
nav.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--txt)}
nav.tabs button.on .e{filter:none}

/* ---------- timer ---------- */
.timerwrap{
  height:8px;border-radius:99px;background:#141a22;overflow:hidden;
  border:1px solid #1e2733;flex:none;
}
#timerFill{
  height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#39d07a,#8ee06a);
}
#timerFill.warn{background:linear-gradient(90deg,#ffb02e,#ffd166)}
#timerFill.danger{background:linear-gradient(90deg,#ff3b4e,#ff7a6b)}

/* ---------- bay ---------- */
.garage{
  position:relative;flex:1;min-height:0;border-radius:18px;
  background:linear-gradient(180deg,#151c26 0%,#121821 58%,#0e131a 100%);
  border:1px solid #1d2632;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px;
}
.garage::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:30%;
  background:repeating-linear-gradient(90deg,#161f2a 0 24px,#131b24 24px 48px);
  opacity:.6;border-top:1px solid #1d2733;
}
.lamp{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:60px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,205,120,.25),transparent 70%);
  pointer-events:none;
}
.door{
  position:absolute;top:0;left:0;right:0;height:40%;
  background:repeating-linear-gradient(180deg,#1b2531 0 9px,#161f29 9px 18px);
  border-bottom:2px solid #2a3646;
  transform-origin:top;transform:scaleY(.06);
  transition:transform .45s ease;z-index:1;
}
.door.closed{transform:scaleY(1)}
.baylabel{
  position:absolute;top:8px;left:10px;z-index:4;
  font-size:10px;font-weight:800;letter-spacing:1px;color:#4d5c6e;
  text-transform:uppercase;
}
.carwrap{
  position:relative;width:100%;max-width:340px;z-index:2;
  animation:bob 3.2s ease-in-out infinite;
  transition:transform .45s ease,opacity .45s ease;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.carwrap.gone{transform:translateX(130%);opacity:0}
.carwrap.enter{animation:driveIn .55s ease-out}
@keyframes driveIn{from{transform:translateX(130%)}to{transform:translateX(0)}}
.carwrap.shake{animation:shake .38s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px) rotate(-1.2deg)}
  40%{transform:translateX(8px) rotate(1.2deg)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(4px)}
}
.car{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.plate{
  position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
  background:#f2f5f8;color:#1a2230;
  font-size:10px;font-weight:800;letter-spacing:.5px;
  padding:2px 7px;border-radius:3px;border:2px solid #c9d2dc;
  white-space:nowrap;
}
.client{
  position:relative;z-index:3;width:100%;max-width:340px;
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--dim);margin-bottom:2px;
  justify-content:center;flex-wrap:wrap;
}
.client b{color:var(--txt);font-weight:700}
.stage{
  background:#2a1f10;color:var(--acc);border:1px solid #4a3416;
  border-radius:99px;padding:1px 8px;font-size:10px;font-weight:800;
}
.bubble{
  position:relative;z-index:3;margin-top:6px;max-width:100%;
  background:var(--panel2);border:1px solid #2a3646;border-radius:14px;
  padding:9px 14px;font-size:15px;line-height:1.3;text-align:center;font-weight:600;
  animation:pop .25s ease-out;
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.bubble .q{color:var(--acc)}

/* idle / result panel */
.center-panel{
  position:relative;z-index:3;display:flex;flex-direction:column;
  align-items:center;gap:10px;text-align:center;padding:8px 6px;
}
.center-panel .big{font-size:44px;line-height:1}
.center-panel h3{margin:0;font-size:17px}
.center-panel p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.4;max-width:270px}

/* floating feedback */
.float{
  position:absolute;left:50%;top:30%;font-size:24px;font-weight:900;
  pointer-events:none;z-index:9;transform:translate(-50%,0);
  animation:floatUp .95s ease-out forwards;
  text-shadow:0 4px 14px rgba(0,0,0,.7);
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
  25%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-70px) scale(1)}
}
.spark{
  position:absolute;width:7px;height:7px;border-radius:50%;
  pointer-events:none;z-index:8;animation:sparkOut .55s ease-out forwards;
}
@keyframes sparkOut{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}
}

/* ---------- tools ---------- */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}
.tool{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:9px 4px;
  background:linear-gradient(180deg,#1d2733,#161e28);
  border:1px solid #2a3646;border-radius:14px;
  color:var(--txt);font-family:inherit;font-size:11px;font-weight:600;line-height:1.15;
  cursor:pointer;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;
}
.tool .e{font-size:22px;line-height:1}
.tool:active{transform:scale(.95)}
.tool.right{border-color:var(--ok);background:linear-gradient(180deg,#1b3a2b,#16301f);
  box-shadow:0 0 0 1px rgba(61,220,132,.4),0 0 18px rgba(61,220,132,.25)}
.tool.wrong{border-color:var(--bad);background:linear-gradient(180deg,#3a1b20,#301619);animation:shake .35s}
.tool.hint{border-color:var(--acc);box-shadow:0 0 0 1px rgba(255,138,31,.5),0 0 16px rgba(255,138,31,.3)}
.tool:disabled{opacity:.45}

/* ---------- buttons ---------- */
.btn{
  width:100%;padding:13px;border:0;border-radius:14px;
  background:linear-gradient(180deg,#ff9a2e,#f07c00);color:#1a1206;
  font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 20px rgba(255,138,31,.25);transition:transform .08s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{
  background:transparent;color:var(--dim);border:1px solid var(--line);
  box-shadow:none;font-size:13px;font-weight:600;padding:10px;
}
.btn.sm{padding:10px;font-size:13px;border-radius:11px}
.linkbtn{
  background:none;border:0;color:#4f5d6e;font-family:inherit;
  font-size:11.5px;padding:10px;text-decoration:underline;cursor:pointer;
}

/* ---------- cards ---------- */
.carCard{
  background:linear-gradient(180deg,#1a222d,#141b24);
  border:1px solid var(--line);border-radius:16px;
  padding:11px;margin-bottom:9px;
}
.carRow{display:flex;align-items:center;gap:10px}
.thumb{width:88px;flex:none}
.thumb .car{filter:none}
.cinfo{flex:1;min-width:0}
.cname{font-size:14.5px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11px;color:var(--dim);margin-bottom:5px}
.bar{height:6px;border-radius:99px;background:#0f151d;overflow:hidden;border:1px solid #1e2733}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e2574c,#f0b429,#3ddc84);border-radius:99px;transition:width .3s}
.cvalue{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:9px 0 8px;font-size:12px;color:var(--dim);
}
.cvalue b{font-size:16px;color:var(--txt);font-variant-numeric:tabular-nums}
.cactions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cactions .sell{grid-column:1 / -1}
.cactions button{
  padding:9px 6px;border-radius:11px;border:1px solid var(--line);
  background:#1d2733;color:var(--txt);font-family:inherit;
  font-size:11.5px;font-weight:700;cursor:pointer;transition:transform .08s;
  font-variant-numeric:tabular-nums;
}
.cactions button:active{transform:scale(.97)}
.cactions button:disabled{opacity:.35}
.cactions button.sell{background:linear-gradient(180deg,#1f5c3a,#164a2e);border-color:#2c7a4d;color:#c9f5da}
.cactions button.buy{background:linear-gradient(180deg,#ff9a2e,#f07c00);border-color:#f07c00;color:#1a1206;grid-column:1 / -1;padding:11px}
.empty{
  text-align:center;color:var(--dim);font-size:13px;line-height:1.5;
  padding:40px 20px;
}
.empty .big{font-size:40px;display:block;margin-bottom:8px}
.section-title{
  font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:#4f5d6e;margin:4px 0 8px 2px;
}
.wallet-line{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:10px 13px;margin-bottom:9px;font-size:12.5px;color:var(--dim);
}
.wallet-line b{font-size:16px;color:var(--txt);font-variant-numeric:tabular-nums}

/* ---------- overlay ---------- */
.overlay{
  position:absolute;inset:0;z-index:30;background:rgba(8,11,15,.87);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fade .25s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  width:100%;max-width:340px;
  background:linear-gradient(180deg,#1a222d,#131a23);
  border:1px solid var(--line);border-radius:20px;padding:20px;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pop .3s ease-out;
}
.card h1{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}
.card h2{margin:0 0 10px;font-size:20px}
.card p{margin:0 0 14px;color:var(--dim);font-size:13px;line-height:1.45}
.card .big{font-size:42px;margin-bottom:8px}
.stats{
  display:flex;justify-content:space-around;margin:0 0 16px;padding:12px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.legend{
  display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;
  margin:12px 0 16px;text-align:left;font-size:12px;color:var(--dim);
}
.legend i{font-style:normal;margin-right:5px}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:#222d3a;border:1px solid #33414f;color:var(--txt);
  padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;
  z-index:40;animation:toastIn .25s;box-shadow:0 8px 24px rgba(0,0,0,.5);
  white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- осмотр машины ---------- */
.inspect .card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.inspect .card-head h2{margin:0;font-size:17px;flex:1;text-align:left}
.inspect .sub{margin:0 0 9px;text-align:left;font-size:11.5px;color:var(--dim);line-height:1.35}
.inspect .parts{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;text-align:left}
.partRow{
  background:#182029;border:1px solid #263140;border-radius:13px;
  padding:8px 10px;display:flex;gap:9px;align-items:center;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,opacity .15s;
}
.partRow.open{border-color:var(--acc);box-shadow:0 0 0 1px rgba(255,138,31,.35)}
.partRow.fixed{opacity:.5}
.partRow .pe{font-size:18px;line-height:1}
.partRow .pinfo{flex:1;min-width:0}
.partRow .pname{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:800}
.partRow .pname span{color:var(--dim);font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
.partRow .pfault{font-size:11px;color:var(--dim);line-height:1.25;margin-top:2px}
.partRow .pfault.ok{color:var(--ok)}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}
.palette .tool{padding:7px 2px;gap:2px;font-size:9px;border-radius:11px}
.palette .tool .e{font-size:17px}
.inspect .hint{margin:7px 0 0;font-size:10.5px;color:var(--dim);text-align:center;line-height:1.3}

/* ---------- зимний ивент ---------- */
.winter-card{
  background:linear-gradient(180deg,#16283a,#111a24);
  border:1px solid #26405a;border-radius:16px;padding:12px;margin-bottom:9px;
}
.winter-card .wq{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7fc4ff}
.winter-card h3{margin:6px 0 4px;font-size:15.5px;line-height:1.25}
.winter-card p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.35}
.wbar{height:8px;border-radius:99px;background:#0f1720;border:1px solid #22303f;overflow:hidden;margin:9px 0 3px}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#5fb8ff,#a9e2ff);border-radius:99px;transition:width .3s}
.wmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
.wmeta b{color:var(--txt);font-variant-numeric:tabular-nums}
.wgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
.wstep{
  font-size:10px;text-align:center;padding:4px 0;border-radius:7px;
  background:#141d27;border:1px solid #22303f;color:#4f5d6e;
  font-variant-numeric:tabular-nums;
}
.wstep.done{background:#173a2b;border-color:#2c7a4d;color:#9df0c1}
.wstep.now{background:#2a1f10;border-color:#7a5320;color:#ffb45c}
.wstep.prize{background:#1b2b3d;border-color:#3f6285;color:#a9e2ff}

/* ---------- сцена осмотра ---------- */
.card.inspect{max-height:calc(100vh - 40px);overflow-y:auto}
.scene{position:relative;border-radius:14px;overflow:hidden;background:#0b1016;border:1px solid #263140;margin:0 0 7px}
.scene svg{display:block;width:100%;height:auto}
.scene.shake{animation:shake .4s}
.mk{
  position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:2px solid #ff4d5e;box-sizing:border-box;box-shadow:0 0 0 5px rgba(255,77,94,.14);
  animation:mkPulse 1.3s ease-out infinite;pointer-events:none;
}
.mk::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#ff4d5e}
@keyframes mkPulse{0%{transform:scale(.85);opacity:1}70%{transform:scale(1.22);opacity:.72}100%{transform:scale(.85);opacity:1}}
.fxWrap{position:absolute;width:0;height:0;pointer-events:none}
.fx{position:absolute;left:0;top:0;font-size:30px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.65))}
.ring{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid #ffd98a;animation:ringOut .5s ease-out 2}
.ring.d2{animation-delay:.26s}
@keyframes ringOut{0%{transform:scale(.35);opacity:.95}100%{transform:scale(2.9);opacity:0}}
.fx-hammer{animation:hammerHit .5s ease-in-out 2}
@keyframes hammerHit{
  0%{transform:translate(-95%,-115%) rotate(-38deg)}
  38%{transform:translate(-50%,-16%) rotate(14deg)}
  48%{transform:translate(-95%,-110%) rotate(-34deg)}
  88%{transform:translate(-50%,-16%) rotate(14deg)}
  100%{transform:translate(-80%,-90%) rotate(-26deg)}
}
.fx-wrench{animation:turn .5s ease-in-out 2}
@keyframes turn{0%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
.fx-screw{animation:turn .3s linear 3}
.fx-oil{animation:oilTilt .9s ease-in-out 1;transform-origin:60% 25%}
@keyframes oilTilt{0%{transform:translate(-50%,-90%) rotate(-10deg)}35%{transform:translate(-50%,-50%) rotate(24deg)}70%{transform:translate(-50%,-50%) rotate(18deg)}100%{transform:translate(-50%,-80%) rotate(-6deg)}}
.drop{position:absolute;left:0;top:6px;width:7px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7fc4ff;opacity:0;animation:dropFall .55s ease-in .25s infinite}
.drop.d2{animation-delay:.42s;background:#5fb8ff}
.drop.d3{animation-delay:.58s}
@keyframes dropFall{0%{transform:translate(-50%,0);opacity:0}20%{opacity:.95}100%{transform:translate(-50%,54px);opacity:0}}
.fx-pump{animation:puffUp .45s ease-out 2}
@keyframes puffUp{0%{transform:translate(-50%,-50%) scale(.8)}45%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.puff{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:#9fb0c4;opacity:0;animation:puffOut .6s ease-out .2s 2}
.puff.d2{animation-delay:.45s}
@keyframes puffOut{0%{transform:translate(-50%,0) scale(.4);opacity:.55}100%{transform:translate(-50%,-36px) scale(1.6);opacity:0}}
.fx-scan{animation:scanFloat .9s ease-in-out 1}
@keyframes scanFloat{0%{transform:translate(-50%,-70%) rotate(-8deg)}50%{transform:translate(-50%,-50%) rotate(4deg)}100%{transform:translate(-50%,-60%) rotate(-4deg)}}
.scanring{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #7fc4ff;animation:ringOut .8s ease-out infinite}
.scanring.d2{animation-delay:.4s}

/* зоны на карточке */
.zoneTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:7px}
.zchip{
  padding:6px 2px;border-radius:10px;background:#141c25;border:1px solid #263140;color:var(--dim);
  font-family:inherit;font-size:9px;font-weight:700;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
}

function randomPlate(){

/* ================= economy ================= */
function carValue(car){
  var v = car.base * (0.35 + 0.65*car.cond/100) * (1 + 0.15*car.tune);
  return round1000(v);
}
function repairStepPoints(car){ return Math.min(25, 100 - car.cond); }
function repairStepCost(car){
  return round1000(repairStepPoints(car) * car.base * 0.0025);
}
function tuneCost(car){ return round1000(car.base * 0.10); }
function shopPrice(base, cond){
  var p = base * (0.35 + 0.55*cond/100) * (0.85 + Math.random()*0.25);
  return round1000(p);
}

/* ================= детали машины ================= */
function partById(id){
  for(var i=0;i<PART_DEFS.length;i++){ if(PART_DEFS[i].id === id) return PART_DEFS[i]; }
  return PART_DEFS[0];
}
function carParts(car){
  if(!car.parts || typeof car.parts !== "object"){ car.parts = {}; }
  for(var i=0;i<PART_DEFS.length;i++){
    var id = PART_DEFS[i].id;
    var p = car.parts[id];
    if(!p || typeof p.cond !== "number"){
      car.parts[id] = {
        cond: clamp((car.cond || 0) + rnd(21) - 10, 0, 100),
        fault: rnd(PART_DEFS[i].faults.length)
      };
    } else if(typeof p.fault !== "number" || p.fault < 0 || p.fault >= PART_DEFS[i].faults.length){
      p.fault = rnd(PART_DEFS[i].faults.length);
    }
  }
  if(car.cond >= 100){
    for(var k in car.parts){ car.parts[k].cond = 100; }
  }
  return car.parts;
}
function carCond(car){
  var parts = carParts(car), sum = 0, n = 0;
  for(var i=0;i<PART_DEFS.length;i++){
    var p = parts[PART_DEFS[i].id];
    if(p){ sum += p.cond; n++; }
  }
  return n ? Math.round(sum/n) : car.cond;
}
function partRepairCost(car, p){
  return Math.max(1000, round1000((100 - p.cond) * car.base * 0.0012));
}

}
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);

      var d = JSON.parse(raw);
      if(d && typeof d.money === "number"){
        DB = d;
        var def = defaultDB();
        for(var k in def){ if(!(k in DB)) DB[k] = def[k]; }
      }
    }
  }catch(e){}
  if(!DB) DB = defaultDB();
  if(!DB.winter || typeof DB.winter.i !== "number") DB.winter = { i:0, cur:0, ready:false, cleared:false };

/* ================= sound ================= */
var audioCtx = null, soundOn = true;
function beep(freq, dur, type, vol){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (dur || 0.12));
  }catch(e){}
}
function buzz(ms){
  if(!soundOn) return;
  if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
}

var toastTimer = null;

  var d = document.createElement("div");
  d.className = "toast";
  d.textContent = msg;
  $("app").appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ d.remove(); }, 1800);
}

/* ================= shift: orders ================= */
function orderTime(){
  var base = 24 - (DB.level-1)*0.7;
  return Math.max(13, base);
}
function makeOrder(){
  var fault = pick(FAULTS);
  var model = pick(MODELS);
  var steps = [];
  // sometimes the client asks for diagnostics first
  if(DB.level >= 2 && fault.tool !== "scanner" && Math.random() < 0.35){
    steps.push({tool:"scanner", txt:"Сначала найди причину — подключи сканер"});
  }
  steps.push({tool:fault.tool, txt:fault.txt});
  return {
    client: pick(CLIENTS),
    model: model.n,
    color: pick(COLORS),
    plate: randomPlate(),
    steps: steps
  };
}

function acceptOrder(){
  if(DB.hearts <= 0){ endShift(); return; }
  R.order = makeOrder();

  R.locked = false;

function buildTools(){

function pickTool(id, btn){
  if(!R.active || R.locked || !R.order) return;
  R.locked = true;
  pauseTimer();

  var st = R.order.steps[R.stage];
  var correct = (id === st.tool);

  if(correct){
    btn.classList.add("right");
    beep(660,0.09,"triangle",0.07);
    buzz(15);
    if(R.stage < R.order.steps.length - 1){
      // next stage of the same order
      setTimeout(function(){
        R.stage++;
        R.locked = false;
        renderStage();
        startTimer(orderTime());
      }, 500);
    } else {
      finishOrder();
    }
  } else {
    failOrder(btn, st.tool);
  }
}

function finishOrder(){
  var left = Math.max(0, T.remaining);
  var reward = Math.round((2500 + left*500 + DB.streak*500) / 10) * 10;
  DB.streak++;
  DB.fixed++;
  DB.shiftEarned += reward;
  winterAdd("order", 1);
  winterAdd("earn", reward);
  setMoney(DB.money + reward);
  if(DB.money > DB.best) DB.best = DB.money;

  sparks();
  floatText("+"+fmtN(reward)+" ₽", "#3ddc84");
  bump($("walletChip"));
  beep(880,0.1,"triangle",0.06);
  setTimeout(function(){ beep(1180,0.12,"triangle",0.05); }, 90);
  buzz(20);

  var leveled = (DB.fixed % 5 === 0);
  if(leveled){
    DB.level++;
    if(DB.hearts < DB.maxHearts){ DB.hearts++; }
    renderHeader();
    setTimeout(function(){
      toast("Уровень "+DB.level+"! Заказы сложнее, оплата выше");
      beep(520,0.1,"sine",0.06);
    }, 700);
  }

  R.active = false;
  R.locked = true;
  save();

  // car drives out
  var cw = $("carwrap");
  cw.classList.remove("enter");
  cw.classList.add("gone");
  $("door").classList.remove("closed");
  setTimeout(function(){ $("door").classList.add("closed"); }, 620);

  setTimeout(function(){
    R.order = null;
    showIdle("Заказ выполнен", "Клиент доволен и уехал. Следующая машина уже во дворе.", "Следующий заказ");
    $("timerFill").style.width = "100%";
    $("timerFill").className = "";
    save();
  }, 700);
}

function failOrder(btn, rightTool){
  DB.streak = 0;
  DB.hearts--;
  renderHeader();
  if(btn) btn.classList.add("wrong");
  var cw = $("carwrap");
  cw.classList.add("shake");
  setTimeout(function(){ cw.classList.remove("shake"); }, 400);
  floatText("−1 ❤️", "#ff4d5e");
  beep(180,0.22,"sawtooth",0.07);
  buzz(120);

  var rb = $("tools").querySelector('[data-tool="'+rightTool+'"]');
  if(rb) rb.classList.add("hint");
  else if(rightTool) toast("Нужен был: " + toolLabel(rightTool));

  R.active = false;
  R.locked = true;
  save();

  var dead = DB.hearts <= 0;
  setTimeout(function(){
    cw.classList.remove("enter");
    cw.classList.add("gone");
    $("door").classList.remove("closed");
    setTimeout(function(){ $("door").classList.add("closed"); }, 620);
    setTimeout(function(){
      R.order = null;
      if(dead){ endShift(); }
      else { showIdle("Клиент уехал расстроенным", "Машину пришлось отпустить. Не беда — приедет следующая.", "Принять заказ"); }
    }, 500);
  }, dead ? 800 : 1200);
}

/* ================= timer ================= */
function startTimer(limit){
  cancelAnimationFrame(T.raf);
  T.limit = limit;
  T.remaining = limit;
  T.start = performance.now();
  T.running = true;
  T.raf = requestAnimationFrame(tick);
}
function tick(now){
  if(!T.running) return;
  var elapsed = (now - T.start)/1000;
  var left = T.limit - elapsed;
  if(left <= 0){
    T.running = false;
    T.remaining = 0;
    $("timerFill").style.width = "0%";
    timeUp();
    return;
  }
  T.remaining = left;
  var p = left / T.limit;
  $("timerFill").style.width = (p*100).toFixed(1)+"%";
  $("timerFill").className = p > .5 ? "" : (p > .25 ? "warn" : "danger");
  T.raf = requestAnimationFrame(tick);
}
function pauseTimer(){
  if(!T.running) return;
  T.remaining = Math.max(0, T.limit - (performance.now() - T.start)/1000);
  T.running = false;
  cancelAnimationFrame(T.raf);
}
function resumeTimer(){
  if(T.running || !R.active || T.remaining <= 0) return;
  T.start = performance.now() - (T.limit - T.remaining)*1000;
  T.running = true;
  T.raf = requestAnimationFrame(tick);
}
function timeUp(){
  if(!R.active) return;
  R.active = false;
  R.locked = true;
  DB.streak = 0;
  DB.hearts--;
  renderHeader();
  save();

  var cw = $("carwrap");
  cw.classList.add("shake");
  setTimeout(function(){ cw.classList.remove("shake"); }, 400);
  floatText("Время вышло!", "#ff4d5e");
  beep(150,0.3,"sawtooth",0.07);
  buzz(150);

  var st = R.order.steps[R.stage];
  var rb = $("tools").querySelector('[data-tool="'+st.tool+'"]');
  if(rb) rb.classList.add("hint");

  var dead = DB.hearts <= 0;
  setTimeout(function(){
    cw.classList.remove("enter");
    cw.classList.add("gone");
    $("door").classList.remove("closed");
    setTimeout(function(){ $("door").classList.add("closed"); }, 620);
    setTimeout(function(){
      R.order = null;
      if(dead){ endShift(); }
      else { showIdle("Время вышло", "Клиент не дождался и уехал. В следующий раз быстрее.", "Принять заказ"); }
    }, 500);
  }, dead ? 900 : 1300);
}

/* ================= shift lifecycle ================= */
function startShift(){
  DB.hearts = DB.maxHearts;
  DB.fixed = 0;
  DB.streak = 0;
  DB.shiftEarned = 0;
  R.order = null; R.stage = 0; R.active = false; R.locked = false;
  $("endScreen").classList.add("hidden");
  renderHeader();
  showIdle("Смена не начата", "Машины ждут во дворе. Прими первый заказ, когда будешь готов.", "Принять заказ");
  switchTab("shift");
  save();
}
function endShift(){
  pauseTimer();
  R.active = false;
  winterAdd("shift", 1);
  $("endEarned").textContent = fmtN(DB.shiftEarned);
  $("endFixed").textContent = DB.fixed;
  $("endLevel").textContent = DB.level;
  $("endEmoji").textContent = DB.shiftEarned >= 40000 ? "🏆" : (DB.shiftEarned >= 15000 ? "🥈" : "🧰");
  var t;
  if(DB.shiftEarned >= 60000) t = "Легендарная смена. Клиенты записываются за месяц вперёд.";
  else if(DB.shiftEarned >= 30000) t = "Отличная смена! Мастерская на хорошем счету.";
  else if(DB.shiftEarned >= 10000) t = "Неплохо. Пара клиентов уехала недовольной.";
  else if(DB.fixed > 0) t = "Начало положено. Ещё немного практики.";
  else t = "Пока без заказов. Ничего, руки привыкнут к ключу.";
  $("endText").textContent = t;
  $("endScreen").classList.remove("hidden");
  save();
}

function floatText(txt, color){

function sparks(){
  var r = $("carwrap").getBoundingClientRect();
  var g = $("garage").getBoundingClientRect();
  var cx = r.left - g.left + r.width/2;
  var cy = r.top - g.top + r.height/2;
  for(var i=0;i<10;i++){
    var s = document.createElement("div");
    s.className = "spark";
    var a = Math.random()*Math.PI*2, d = 40 + Math.random()*70;
    s.style.setProperty("--dx", (Math.cos(a)*d).toFixed(0)+"px");
    s.style.setProperty("--dy", (Math.sin(a)*d).toFixed(0)+"px");
    s.style.left = cx+"px";
    s.style.top = cy+"px";
    s.style.background = i%2 ? "#3ddc84" : "#ffd166";
    $("garage").appendChild(s);
    (function(node){ setTimeout(function(){ node.remove(); }, 600); })(s);
  }
}

function sceneSVG(zone, variant, cond, color){

function markerHTML(zone, variant, fixed){

  return '<div class="mk" style="left:'+m[0]+'%;top:'+m[1]+'%"></div>'+
    '<div class="fxWrap" id="fxWrap" style="left:'+m[0]+'%;top:'+m[1]+'%"></div>';

function toolsPaletteHTML(){

function openInspect(id){
  var c = findCar(id);
  if(!c) return;
  INSP.carId = id;
  SCENE.mode = "garage";
  SCENE.busy = false;
  SCENE.color = c.color;
  var parts = carParts(c);
  var first = "engine";
  for(var i=0;i<PART_DEFS.length;i++){
    if(parts[PART_DEFS[i].id].cond < 100){ first = PART_DEFS[i].id; break; }
  }
  INSP.partId = first;
  $("inspTitle").textContent = c.model;
  $("inspPalette").classList.add("hidden");
  $("inspPalette").innerHTML = "";
  $("inspParts").style.display = "";
  $("inspectScreen").classList.remove("hidden");
  renderInspect();
  beep(420,0.06,"sine",0.04);
}
function closeScene(resume){
  var mode = SCENE.mode;
  SCENE.busy = false;
  $("inspectScreen").classList.add("hidden");
  if(mode === "garage"){
    INSP.carId = null;
    INSP.partId = null;
    renderGarage();
  } else if(resume && R.active){
    resumeTimer();
  }
}
function closeInspect(){ closeScene(true); }

function nextBrokenPart(c, skipId){
  var parts = carParts(c);
  for(var i=0;i<PART_DEFS.length;i++){
    var id = PART_DEFS[i].id;
    if(id === skipId) continue;
    if(parts[id].cond < 100) return id;
  }
  return null;
}
function renderInspect(){
  var c = findCar(INSP.carId);
  if(!c) return;
  var parts = carParts(c);
  c.cond = carCond(c);

  var chips = "", fixed = 0;
  for(var i=0;i<PART_DEFS.length;i++){
    var d = PART_DEFS[i], p = parts[d.id], ok = p.cond >= 100;
    if(ok) fixed++;
    chips += '<button class="zchip'+(INSP.partId === d.id ? " on" : "")+(ok ? " ok" : "")+'" data-part="'+d.id+'">'+
      '<span class="ze">'+d.e+'</span><b>'+p.cond+'%</b>'+
      '<span class="zn">'+PART_SHORT[d.id]+'</span></button>';
  }
  $("inspParts").innerHTML = chips;
  $("inspParts").style.display = "";
  $("inspSub").textContent = "Состояние "+c.cond+"% · в порядке "+fixed+"/"+PART_DEFS.length;

  if(!INSP.partId || !parts[INSP.partId]) INSP.partId = "engine";
  var pd = partById(INSP.partId), pp = parts[INSP.partId];
  var okPart = pp.cond >= 100;
  var zone = zoneOfPart(INSP.partId);
  var fault = pd.faults[pp.fault] || pd.faults[0];
  var variant = okPart ? "ok" : fault.tool;

  $("sceneBox").innerHTML = sceneSVG(zone, variant, pp.cond, c.color) + markerHTML(zone, variant, okPart);
  $("sceneFault").innerHTML = okPart
    ? '<span class="ok">✓ '+pd.name+': в порядке</span>'
    : '<b>'+pd.name+':</b> '+fault.txt;

  var pal = $("inspPalette");
  if(okPart){
    pal.innerHTML = "";
    pal.classList.add("hidden");
    $("inspHint").textContent = fixed === PART_DEFS.length
      ? "Машина в полном порядке."
      : "Эта деталь в порядке — выбери другую зону.";
    return;
  }
  var cost = partRepairCost(c, pp);
  pal.innerHTML = toolsPaletteHTML();
  pal.classList.remove("hidden");
  $("inspHint").textContent = "Ремонт: "+(DB.money >= cost ? fmt(cost) : "не хватает "+fmt(cost - DB.money));
}

function sceneUseTool(toolId){
  if(SCENE.mode === "garage") garageUseTool(toolId);
  else shiftUseTool(toolId);
}
function garageUseTool(toolId){
  var c = findCar(INSP.carId);
  if(!c || !INSP.partId || SCENE.busy) return;
  var parts = carParts(c), p = parts[INSP.partId];
  if(!p || p.cond >= 100) return;
  var d = partById(INSP.partId);
  var fault = d.faults[p.fault] || d.faults[0];
  var cost = partRepairCost(c, p);
  var correct = (toolId === fault.tool);
  var fee = Math.max(500, round1000(cost * 0.2));

  if(DB.money < (correct ? cost : fee)){
    toast("Не хватает "+fmt((correct ? cost : fee) - DB.money));
    beep(180,0.15,"sawtooth",0.06);
    return;
  }

  playToolFx(toolId);
  setTimeout(function(){
    if(!correct){
      setMoney(DB.money - fee);
      beep(170,0.22,"sawtooth",0.07);
      buzz(90);
      var sb = $("sceneBox");
      sb.classList.add("shake");
      setTimeout(function(){ sb.classList.remove("shake"); }, 420);
      toast("Не тот инструмент · −"+fmtN(fee)+" ₽");
      renderInspect();
      $("inspHint").textContent = "Нужен был: " + toolLabel(fault.tool);
      return;
    }
    setMoney(DB.money - cost);
    p.cond = Math.min(100, p.cond + 25);
    p.fault = rnd(d.faults.length);
    c.cond = carCond(c);
    beep(620,0.08,"triangle",0.06);
    buzz(15);
    toast(d.name+": "+p.cond+"%");
    winterAdd("repair", 1);
    if(p.cond >= 100){
      var nb = nextBrokenPart(c, d.id);
      if(nb) INSP.partId = nb;
    }
    renderInspect();
    save();
  }, FX_MS);
}

function openWorkScene(){
  if(!R.active || R.locked || !R.order) return;
  var st = R.order.steps[R.stage];
  if(!st) return;
  pauseTimer();
  SCENE.mode = "shift";
  SCENE.busy = false;
  SCENE.zone = zoneOfFault(st);
  SCENE.variant = st.tool;
  SCENE.color = R.order.color;
  $("inspTitle").textContent = R.order.model;
  $("inspSub").textContent = R.order.client + " · заказ";
  $("inspParts").innerHTML = "";
  $("inspParts").style.display = "none";
  $("sceneBox").innerHTML = sceneSVG(SCENE.zone, SCENE.variant, 55, R.order.color)+markerHTML(SCENE.zone, SCENE.variant, false);
  $("sceneFault").innerHTML = "<b>Осмотр:</b> " + st.txt;
  $("inspPalette").innerHTML = toolsPaletteHTML();
  $("inspPalette").classList.remove("hidden");
  $("inspHint").textContent = "Смотри, где поломка, и выбери инструмент.";
  $("inspectScreen").classList.remove("hidden");
  beep(420,0.06,"sine",0.04);
}
function shiftUseTool(toolId){
  if(SCENE.busy) return;
  var st = R.order && R.order.steps[R.stage];
  if(!st) return;
  R.locked = true;
  var correct = (toolId === st.tool);
  playToolFx(toolId);
  setTimeout(function(){
    if(correct){
      closeScene(false);
      beep(660,0.09,"triangle",0.07);
      buzz(15);
      if(R.stage < R.order.steps.length - 1){
        R.stage++;
        R.locked = false;
        renderStage();
        startTimer(orderTime());
      } else {
        R.locked = false;
        finishOrder();
      }
    } else {
      closeScene(false);
      failOrder(null, st.tool);
    }
  }, FX_MS);
}

function playToolFx(toolId){
  SCENE.busy = true;
  var wrap = $("fxWrap");
  var TOOL_E = {wrench:"🔧",screw:"🪛",hammer:"🔨",oil:"🛢️",scanner:"🔌",pump:"💨"};
  if(wrap){
    var extra = '<i class="ring"></i>';
    if(toolId === "hammer") extra = '<i class="ring"></i><i class="ring d2"></i>';
    else if(toolId === "oil") extra = '<i class="drop"></i><i class="drop d2"></i><i class="drop d3"></i>';
    else if(toolId === "pump") extra = '<i class="puff"></i><i class="puff d2"></i>';
    else if(toolId === "scanner") extra = '<i class="scanring"></i><i class="scanring d2"></i>';
    wrap.innerHTML = '<div class="fx fx-'+toolId+'">'+(TOOL_E[toolId] || "🔧")+'</div>'+extra;
  }
  soundTool(toolId);
  var btns = $("inspPalette").querySelectorAll("button");
  for(var i=0;i<btns.length;i++) btns[i].disabled = true;
  setTimeout(function(){ SCENE.busy = false; }, FX_MS);
}
function soundTool(id){
  if(id === "hammer"){
    beep(120,0.08,"square",0.09);
    setTimeout(function(){ beep(100,0.1,"square",0.09); }, 480);
    buzz(28);

    beep(320,0.05,"square",0.05);
    setTimeout(function(){ beep(360,0.05,"square",0.05); }, 480);
    buzz(14);
  } else if(id === "screw"){
    beep(540,0.04,"square",0.04);
    setTimeout(function(){ beep(560,0.04,"square",0.04); }, 240);
    buzz(10);
  } else if(id === "oil"){
    beep(240,0.3,"sine",0.05);
    buzz(12);
  } else if(id === "pump"){
    beep(170,0.16,"sawtooth",0.06);
    setTimeout(function(){ beep(200,0.16,"sawtooth",0.06); }, 460);
    buzz(20);
  } else {
    beep(880,0.06,"sine",0.05);
    setTimeout(function(){ beep(1120,0.06,"sine",0.05); }, 420);
    buzz(10);
  }
}

/* ================= зимний ивент ================= */
function winterReward(i){ return 4000 + i * 1500; }
function winterValue(kind, v){
  return kind === "earn" ? fmtN(v) + " ₽" : v;
}
function winterQuest(){
  var W = DB.winter;
  if(!W || W.cleared || W.i >= WINTER_PLAN.length) return null;
  return WINTER_PLAN[W.i];
}
function winterAdd(kind, amount){
  var W = DB.winter, q = winterQuest();
  if(!W || !q || W.ready || q[0] !== kind) return;
  W.cur += amount;
  if(W.cur >= q[1]){
    W.cur = q[1];
    W.ready = true;
    toast("Квест "+(W.i+1)+" из 30 выполнен!");
    beep(760,0.1,"sine",0.05);
  }
  save();
  renderWinter();
}
function giveWinterCar(){
  var c = { id:uid(), model:"Subaru Impreza WRX · Snow", base:900000, cond:100, tune:3, color:"#9fd8ff", bought:0 };
  var parts = carParts(c);
  for(var k in parts){ parts[k].cond = 100; }
  c.cond = 100;
  DB.cars.push(c);
  save();
  renderGarage();
}
function winterClaim(){
  var W = DB.winter;
  if(!W || !W.ready) return;
  var reward = winterReward(W.i);
  setMoney(DB.money + reward);
  floatText("+"+fmtN(reward)+" ₽", "#9fd8ff");
  beep(880,0.1,"triangle",0.06);
  buzz(20);
  if(W.i >= WINTER_PLAN.length - 1){
    W.cleared = true;
    W.ready = false;
    W.cur = 0;
    giveWinterCar();
    toast("Ивент пройден! Машина в гараже");
  } else {
    W.i++;
    W.cur = 0;
    W.ready = false;
    toast("Квест "+(W.i+1)+" из 30");
  }
  save();
  renderWinter();
}
function renderWinter(){
  var box = $("winterBody");
  var W = DB.winter;
  if(!W) return;
  var total = WINTER_PLAN.length;
  $("winterProgress").textContent = (W.cleared ? total : W.i) + "/" + total;

  var html = "";
  if(W.cleared){
    html +=
      '<div class="winter-card">'+
        '<div class="wq">Ивент пройден</div>'+
        '<h3>❄️ Все 30 квестов выполнены</h3>'+
        '<p>Награда — Subaru Impreza WRX · Snow с полным тюнингом. Ищи её в гараже.</p>'+
      '</div>';
  } else {
    var q = WINTER_PLAN[W.i];
    var target = q[1], cur = Math.min(W.cur, target);
    var pct = Math.round(cur / target * 100);
    html +=
      '<div class="winter-card">'+
        '<div class="wq">Квест '+(W.i+1)+' из '+total+'</div>'+
        '<h3>'+WINTER_TEXT[q[0]]+'</h3>'+
        '<p>Зимняя подработка: клиенты платят больше, но и работы больше. '+
          'Выполни задание и забери награду.</p>'+
        '<div class="wbar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="wmeta"><span>'+winterValue(q[0], cur)+' / '+winterValue(q[0], target)+'</span>'+
          '<b>+ '+fmt(winterReward(W.i))+'</b></div>'+
        (W.ready ? '<button class="btn" data-winter="claim" style="margin-top:10px">🎁 Забрать награду</button>' : '')+
      '</div>';
  }

  html += '<div class="section-title">Карта ивента · 30 квестов</div><div class="wgrid">';
  for(var i=0;i<total;i++){
    var cls = "wstep";
    if(W.cleared || i < W.i) cls += " done";
    else if(i === W.i) cls += " now";
    if(i === total-1) cls += " prize";
    html += '<div class="'+cls+'">'+(i+1)+'</div>';
  }
  html += '</div>';

  html += '<div class="winter-card">'+
    '<div class="wq">Награда за 30 квестов</div>'+
    '<h3>🚗 Subaru Impreza WRX · Snow</h3>'+
    '<p>Состояние 100%, тюнинг 3/3, ледяной окрас. Достаётся бесплатно и сразу в гараж.</p>'+
  '</div>';

  box.innerHTML = html;
}
function doTune(id){
  var c = findCar(id);
  if(!c || c.tune >= 3) return;
  var cost = tuneCost(c);
  if(DB.money < cost){ toast("Не хватает "+fmt(cost - DB.money)); beep(180,0.15,"sawtooth",0.06); return; }
  setMoney(DB.money - cost);
  c.tune++;
  beep(760,0.08,"sine",0.06);
  setTimeout(function(){ beep(1020,0.1,"sine",0.05); }, 80);
  buzz(15);
  toast(c.model+": тюнинг "+c.tune+"/3");
  winterAdd("tune", 1);
  renderGarage();
}
function doSell(id){
  var c = findCar(id);
  if(!c) return;
  var price = carValue(c);
  var profit = price - (c.bought || c.price || 0);
  for(var i=0;i<DB.cars.length;i++){
    if(DB.cars[i].id === id){ DB.cars.splice(i,1); break; }
  }
  setMoney(DB.money + price);
  beep(880,0.1,"triangle",0.06);
  setTimeout(function(){ beep(1180,0.12,"triangle",0.05); }, 90);
  buzz(20);
  toast("Продано: "+c.model+" · "+fmt(price)+(profit >= 0 ? " (в плюсе)" : " (в минус)"));
  winterAdd("sell", 1);
  renderGarage();
}
function doBuy(id){
  var idx = -1;
  for(var i=0;i<DB.shop.length;i++){ if(DB.shop[i].id === id){ idx = i; break; } }
  if(idx < 0) return;
  var c = DB.shop[idx];
  if(DB.money < c.price){ toast("Не хватает "+fmt(c.price - DB.money)); return; }
  setMoney(DB.money - c.price);
  DB.shop.splice(idx,1);
  c.bought = c.price;
  DB.cars.push(c);
  beep(520,0.09,"sine",0.06);
  setTimeout(function(){ beep(700,0.1,"sine",0.05); }, 90);
  buzz(20);
  toast(c.model+" уже в гараже");
  winterAdd("buy", 1);
  renderGarage();
  renderShop();
}

/* ================= tabs ================= */
function switchTab(name){
  var tabs = document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.add("hidden");
  $("tab-"+name).classList.remove("hidden");
  var btns = document.querySelectorAll("nav.tabs button");
  for(var j=0;j<btns.length;j++){
    btns[j].classList.toggle("on", btns[j].getAttribute("data-tab") === name);
  }
  notifyTab(name);
  if(name === "shift"){
    if(R.active) resumeTimer();
  } else {
    pauseTimer();
    if(name === "garage") renderGarage();
    if(name === "shop") renderShop();
    if(name === "winter") renderWinter();
  }
}

/* ================= events ================= */
function bind(){
  $("mainBtn").addEventListener("click", function(){
    beep(520,0.07,"sine",0.05);
    acceptOrder();
  });
  $("endShiftBtn").addEventListener("click", function(){
    pauseTimer();
    endShift();
  });
  $("againBtn").addEventListener("click", function(){
    startShift();
  });
  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    DB.sound = soundOn;
    $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
    if(soundOn) beep(600,0.08,"sine",0.05);
    save();
  });
  $("refreshShop").addEventListener("click", function(){
    DB.shop = makeShop(4);
    renderShop();
    save();
    beep(520,0.07,"sine",0.05);
    toast("Привезли новые машины");
  });

  $("inspClose").addEventListener("click", function(){ closeScene(true); });
  $("inspParts").addEventListener("click", function(ev){
    if(SCENE.mode !== "garage" || SCENE.busy) return;
    var t = ev.target;
    while(t && t !== this && !t.getAttribute("data-part")) t = t.parentNode;
    if(!t || t === this) return;
    var pid = t.getAttribute("data-part");
    var c = findCar(INSP.carId);
    if(!c) return;
    INSP.partId = pid;
    renderInspect();
    beep(520,0.05,"sine",0.04);
  });
  $("inspPalette").addEventListener("click", function(ev){
    var t = ev.target;
    while(t && t !== this && !t.getAttribute("data-insp-tool")) t = t.parentNode;
    if(!t || t === this) return;
    sceneUseTool(t.getAttribute("data-insp-tool"));
  });
  $("winterBody").addEventListener("click", function(ev){
    var t = ev.target;
    while(t && t !== this && !t.getAttribute("data-winter")) t = t.parentNode;
    if(!t || t === this) return;
    if(t.getAttribute("data-winter") === "claim") winterClaim();
  });

  var nav = document.querySelectorAll("nav.tabs button");
  for(var i=0;i<nav.length;i++){
    (function(b){
      b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
    })(nav[i]);
  }

  $("myCars").addEventListener("click", function(ev){
    var t = ev.target;
    while(t && t !== this && !t.getAttribute("data-act")) t = t.parentNode;
    if(!t || t === this) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if(act === "inspect") openInspect(id);
    else if(act === "tune") doTune(id);
    else if(act === "sell") doSell(id);
  });
  $("shopList").addEventListener("click", function(ev){
    var t = ev.target;
    while(t && t !== this && !t.getAttribute("data-act")) t = t.parentNode;
    if(!t || t === this) return;
    if(t.getAttribute("data-act") === "buy") doBuy(t.getAttribute("data-id"));
  });

  // pause the timer when the app goes to background
  document.addEventListener("visibilitychange", function(){
    var sceneOpen = !$("inspectScreen").classList.contains("hidden");
    if(document.hidden) pauseTimer();
    else if(R.active && !sceneOpen) resumeTimer();
  });

  // desktop testing
  window.addEventListener("keydown", function(ev){
    var map = {"1":"wrench","2":"screw","3":"hammer","4":"oil","5":"scanner","6":"pump"};
    var id = map[ev.key];
    if(id && R.active){
      var b = $("tools").querySelector('[data-tool="'+id+'"]');
      if(b) pickTool(id, b);
    }
  });
}

    switchTab("shift");
  };
  // Пауза таймера, когда приложение уходит в фон.
  window.gamePause = function(){ pauseTimer(); };
  window.gameResume = function(){
    if(R.active && $("inspectScreen").classList.contains("hidden")) resumeTimer();
  };
  notifyReady();
}

init();

})();
</script>
</body>
</html>
